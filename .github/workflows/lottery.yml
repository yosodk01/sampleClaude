name: 로또 자동 구매

on:
  schedule:
    # 매주 월요일 오전 10시 KST (= 01:00 UTC)
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "test-login"
        type: choice
        options:
          - test-login
          - purchase
      purchase_count:
        description: "구매 수량 (purchase 모드에서만 사용)"
        required: false
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 로그인 테스트
        if: github.event.inputs.mode == 'test-login'
        env:
          LOTTERY_ID: ${{ secrets.LOTTERY_ID }}
          LOTTERY_PW: ${{ secrets.LOTTERY_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_login.py

      - name: 로또 자동 구매 실행
        if: github.event.inputs.mode == 'purchase' || github.event_name == 'schedule'
        env:
          LOTTERY_ID: ${{ secrets.LOTTERY_ID }}
          LOTTERY_PW: ${{ secrets.LOTTERY_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PURCHASE_COUNT: ${{ github.event.inputs.purchase_count || vars.PURCHASE_COUNT || '1' }}
        run: python lottery_buyer.py

      - name: 스크린샷 업로드 (항상)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: "*.png"
          retention-days: 7
          if-no-files-found: ignore
